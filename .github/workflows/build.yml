name: Build and push image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - name: Check if base image changed
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_IMAGE=$(grep -m1 '^FROM' Dockerfile | awk '{print $2}')
          NEW_DIGEST=$(docker manifest inspect "$BASE_IMAGE" 2>/dev/null | sha256sum | cut -d' ' -f1)
          OLD_DIGEST_FILE=".base-image-digest"

          if [ -f "$OLD_DIGEST_FILE" ] && [ "$(cat $OLD_DIGEST_FILE)" == "$NEW_DIGEST" ]; then
            echo "Base image unchanged, skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image changed or first run, building."
            echo "$NEW_DIGEST" > "$OLD_DIGEST_FILE"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated digest file
        if: steps.check.outputs.should_build == 'true' && github.event_name == 'schedule'
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add .base-image-digest
          git commit -m "Update base image digest" || echo "No changes to commit"
          git push

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/owentrafalgar/git-cron-runner:latest
            ghcr.io/owentrafalgar/git-cron-runner:${{ steps.tag_version.outputs.new_tag }}

      - name: Add index-level description annotation
        run: |
          docker buildx imagetools create \
            -t ghcr.io/owentrafalgar/git-cron-runner:latest \
            -t ghcr.io/owentrafalgar/git-cron-runner:${{ steps.tag_version.outputs.new_tag }} \
            --annotation "index:org.opencontainers.image.description=Generic container that clones a Git repo, runs a script on a schedule, and commits/pushes changes back." \
            --annotation "index:org.opencontainers.image.source=https://github.com/owentrafalgar/git-cron-runner" \
            ghcr.io/owentrafalgar/git-cron-runner@${{ steps.build.outputs.digest }}
