name: Build and push image

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/owentrafalgar/git-cron-runner:latest
            ghcr.io/owentrafalgar/git-cron-runner:${{ steps.tag_version.outputs.new_tag }}

      - name: Add index-level description annotation
        run: |
          docker buildx imagetools create \
            -t ghcr.io/owentrafalgar/git-cron-runner:latest \
            -t ghcr.io/owentrafalgar/git-cron-runner:${{ steps.tag_version.outputs.new_tag }} \
            --annotation "index:org.opencontainers.image.description=Generic container that clones a Git repo, runs a script on a schedule, and commits/pushes changes back." \
            --annotation "index:org.opencontainers.image.source=https://github.com/owentrafalgar/git-cron-runner" \
            ghcr.io/owentrafalgar/git-cron-runner@${{ steps.build.outputs.digest }}
